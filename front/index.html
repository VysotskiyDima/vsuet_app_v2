<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Зачётная книжка · Рейтинг успеваемости</title>
  <meta name="description" content="Рейтинг успеваемости студентов по номеру зачётной книжки." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='92' fill='none' stroke='%232E2BD6' stroke-width='8'/%3E%3Ccircle cx='100' cy='100' r='74' fill='none' stroke='%232E2BD6' stroke-width='4'/%3E%3Cpath d='M100 60 L112 88 L140 100 L112 112 L100 140 L88 112 L60 100 L88 88 Z' fill='%232E2BD6'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ── Попап КТ ─────────────────────────────────────────── */
    .rt-total--clickable {
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .rt-total--clickable:hover,
    .rt-total--clickable:focus {
      background: rgba(46, 43, 214, 0.08);
      outline: 2px solid rgba(46, 43, 214, 0.4);
      outline-offset: -2px;
    }

    /* ── Popup: bottom-sheet на мобилке, центр на десктопе ── */
    .kt-popup {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 600px) {
      .kt-popup { align-items: center; }
    }
    .kt-popup[hidden] { display: none; }

    .kt-popup__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
    }

    .kt-popup__box {
      position: relative;
      z-index: 1;
      background: #fff;
      /* мобилка — bottom sheet */
      border-radius: 18px 18px 0 0;
      padding: 8px 20px 32px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.18);
    }
    @media (min-width: 600px) {
      .kt-popup__box {
        border-radius: 14px;
        padding: 28px 32px 24px;
        min-width: 320px;
        max-width: 460px;
        width: 90%;
        max-height: none;
        box-shadow: 0 12px 48px rgba(0,0,0,0.22);
      }
    }

    /* drag handle */
    .kt-popup__handle {
      width: 40px; height: 4px;
      background: #ddd; border-radius: 2px;
      margin: 12px auto 20px;
    }
    @media (min-width: 600px) { .kt-popup__handle { display: none; } }

    .kt-popup__close {
      position: absolute;
      top: 14px; right: 16px;
      background: none; border: none;
      font-size: 18px; line-height: 1;
      cursor: pointer; color: #888;
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .kt-popup__close:hover { background: #f0f0f0; color: #222; }

    .kt-popup__title {
      margin: 0 0 18px;
      font-family: 'Golos Text', sans-serif;
      font-size: 1rem; font-weight: 700;
      padding-right: 40px; line-height: 1.35;
    }

    .kt-popup__table {
      width: 100%; border-collapse: collapse;
      font-size: 0.9rem; table-layout: fixed;
    }
    .kt-popup__col-name   { width: 55%; }
    .kt-popup__col-weight { width: 22%; }
    .kt-popup__col-score  { width: 23%; }

    .kt-popup__table th,
    .kt-popup__table td {
      padding: 11px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }
    .kt-popup__table th {
      font-weight: 600; color: #555;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .kt-popup__table th.kt-popup__col-weight,
    .kt-popup__table th.kt-popup__col-score,
    .kt-popup__table td.kt-popup__col-weight,
    .kt-popup__table td.kt-popup__col-score {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
    }
    .kt-popup__table th.kt-popup__col-weight,
    .kt-popup__table th.kt-popup__col-score {
      font-family: 'Golos Text', sans-serif;
      font-size: 0.78rem;
    }
    .kt-popup__table tbody tr:last-child td { border-bottom: none; }

    .kt-popup__total {
      margin-top: 16px; padding-top: 14px;
      border-top: 2px solid #eee;
      font-size: 0.95rem; text-align: right; color: #333;
    }
    .kt-popup__total strong {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem; color: #2E2BD6; margin-left: 6px;
    }

    /* ── Sticky-таблица рейтинга ──────────────────────────── */

    /*
      Обёртка с горизонтальным скроллом.
      overflow-x: auto — скроллится только таблица, не вся страница.
    */
    .rt-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      /* тень-подсказка справа когда есть что скроллить */
      background:
        linear-gradient(to right, white 0%, transparent 100%) 0 0 / 20px 100% no-repeat local,
        linear-gradient(to left,  white 0%, transparent 100%) 100% 0 / 20px 100% no-repeat local,
        linear-gradient(to right, rgba(0,0,0,0.08) 0%, transparent 100%) 0 0 / 12px 100% no-repeat scroll,
        linear-gradient(to left,  rgba(0,0,0,0.08) 0%, transparent 100%) 100% 0 / 12px 100% no-repeat scroll;
    }

    .rt {
      /* важно: border-collapse ломает sticky, нужен separate */
      border-collapse: separate;
      border-spacing: 0;
    }

    /* Колонка «Дисциплина» — прилипает слева */
    .rt .rt-subject {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #fff;
      /* правая граница вместо border-collapse */
      box-shadow: 2px 0 4px -1px rgba(0,0,0,0.10);
    }
    /* Заголовок «Дисциплина» — выше остальных sticky */
    .rt thead .rt-subject {
      z-index: 3;
    }

    /* На мобилке сужаем колонку названия */
    .rt .rt-subject {
      min-width: 130px;
      max-width: 160px;
      white-space: normal;
      word-break: break-word;
      font-size: 0.82rem;
      line-height: 1.3;
    }
    @media (min-width: 640px) {
      .rt .rt-subject {
        min-width: 180px;
        max-width: 240px;
        font-size: inherit;
      }
    }

    /* Остальные ячейки таблицы — убираем лишние отступы на мобилке */
    @media (max-width: 639px) {
      .rt thead th,
      .rt tbody td {
        padding: 8px 10px;
        font-size: 0.82rem;
      }
      .rt-caption { font-size: 0.78rem; }
    }

    /* ── Topbar на мобилке ────────────────────────────────── */
    @media (max-width: 599px) {
      .topbar {
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 16px 10px;
      }
      .topbar__brand { order: 1; }
      #logout-btn    { order: 2; margin-left: auto; padding: 6px 14px; font-size: 0.82rem; }
      .topbar__id    { order: 3; width: 100%; font-size: 0.8rem; padding: 0; }
    }

    /* ── Инпут — не зумить на iOS (font-size >= 16px) ──────── */
    #zach { font-size: 1rem !important; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="seal-mini" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="7" />
      <circle cx="100" cy="100" r="74" fill="none" stroke="currentColor" stroke-width="3" />
      <path d="M100 56 L113 87 L144 100 L113 113 L100 144 L87 113 L56 100 L87 87 Z" fill="currentColor" />
    </symbol>
  </svg>

  <!-- ===================== ВХОД ===================== -->
  <main id="view-login" class="view view--login">
    <section class="cover" aria-labelledby="cover-title">

      <h1 id="cover-title" class="cover__title">Зачётная<br />книжка</h1>
      <p class="cover__sub">Откройте рейтинг успеваемости по номеру зачётной книжки.</p>

      <form id="login-form" class="field" novalidate>
        <label class="field__label" for="zach">Номер зачётной книжки</label>
        <div class="field__row">
          <span class="field__hash" aria-hidden="true">№</span>
          <input
            id="zach"
            class="field__input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            placeholder="Введите номер зачётки"
            aria-describedby="login-error"
          />
          <button id="login-btn" class="btn" type="submit">Открыть</button>
        </div>
        <p id="login-error" class="field__error" role="alert" hidden></p>
      </form>

    </section>
  </main>

  <!-- ===================== РЕЙТИНГ ===================== -->
  <div id="view-rating" class="view view--rating" hidden>
    <header class="topbar">
      <div class="topbar__brand">
        <svg class="brand__seal" viewBox="0 0 200 200" aria-hidden="true"><use href="#seal-mini" /></svg>
        <span class="brand__name">Рейтинг<span class="brand__sep">·</span><span class="brand__sub">успеваемости</span></span>
      </div>
      <div class="topbar__id">
        <span class="topbar__id-label">Зачётная книжка</span>
        <span class="topbar__id-num">№&nbsp;<span id="current-zach">—</span></span>
      </div>
      <button id="logout-btn" class="btn btn--ghost" type="button">Закрыть</button>
    </header>

    <main id="rating-content" class="content" aria-live="polite"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
