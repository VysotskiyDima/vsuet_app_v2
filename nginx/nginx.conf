limit_req_zone $binary_remote_addr zone=api:10m rate=1r/s;

server {
    listen 80;
    server_name universityapp.site portainer.universityapp.site grafana.universityapp.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name grafana.universityapp.site;

    ssl_certificate /etc/letsencrypt/live/universityapp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/universityapp.site/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portainer.universityapp.site;

    ssl_certificate /etc/letsencrypt/live/universityapp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/universityapp.site/privkey.pem;

    location / {
        proxy_pass https://portainer:9443;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name universityapp.site;

    ssl_certificate /etc/letsencrypt/live/universityapp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/universityapp.site/privkey.pem;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json;

    # Метрики Nginx для Prometheus
    location /nginx_status {
        stub_status;
        access_log off;
        allow all;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location = /manifest.json {
            add_header Cache-Control "no-cache, must-revalidate";
            default_type application/manifest+json;
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location ~* \.(css|js)$ {
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location ~* \.(woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }

    location /students/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://app:8000/students/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store";
    }

    location /rating/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://app:8000/rating/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
