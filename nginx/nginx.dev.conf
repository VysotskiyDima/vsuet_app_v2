server {
    listen 80;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /students/ {
        proxy_pass http://app:8000/students/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /rating/ {
        proxy_pass http://app:8000/rating/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}