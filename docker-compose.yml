services:
  app:
    build: .
    container_name: vsuet_rating_v2-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Файл SQLite держим в томе: пересборка образа не должна стирать снапшот.
      # Путь внутри контейнера задаётся переменной DB_PATH (см. .env.example).
      - sqlite-dev-data:/data

  nginx:
    image: nginx:alpine
    container_name: vsuet_rating_v2-nginx
    ports:
      - "80:80"
    volumes:
      - ./front:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  sqlite-dev-data:
