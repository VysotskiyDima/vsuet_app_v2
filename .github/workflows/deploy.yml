name: Build and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: backend

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  build_and_push:
    needs: lint
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      nginx_changed: ${{ steps.filter.outputs.nginx }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'app/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
            nginx:
              - 'nginx/**'

      - name: Calculate next version
        if: steps.filter.outputs.backend == 'true'
        id: version
        run: |
          git fetch --tags

          LAST_TAG=$(git tag -l "v1.0.*" --sort=-v:refname | head -n1)

          if [ -z "$LAST_TAG" ]; then
            VERSION="1.0.0"
          else
            PATCH=${LAST_TAG##*.}
            VERSION="1.0.$((PATCH + 1))"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.filter.outputs.backend == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Create git tag
        if: steps.filter.outputs.backend == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  deploy:
    needs: build_and_push
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e

            cd ${{ secrets.VPS_PROJECT_PATH }}

            git fetch origin main
            git reset --hard origin/main

            if [ "${{ needs.build_and_push.outputs.backend_changed }}" = "true" ]; then
              echo "==> Backend changed"

              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

              export IMAGE_TAG=${{ needs.build_and_push.outputs.version }}

              docker compose -f docker-compose.prod.yml pull app
              docker compose -f docker-compose.prod.yml up -d --no-deps app
            else
              echo "==> Backend unchanged"
            fi

            if [ "${{ needs.build_and_push.outputs.nginx_changed }}" = "true" ]; then
              echo "==> Reload nginx"

              docker exec vsuet_rating_v2-nginx nginx -t
              docker exec vsuet_rating_v2-nginx nginx -s reload
            else
              echo "==> nginx unchanged"
            fi

            docker image prune -f
