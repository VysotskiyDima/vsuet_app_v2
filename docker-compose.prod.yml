services:
  redis:
    image: redis:7-alpine
    container_name: vsuet_rating_v2-redis
    command: ["redis-server", "--save", "60", "1", "--dbfilename", "dump.rdb", "--dir", "/data"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - default

  app:
    image: ghcr.io/w1sentexe/backend:${IMAGE_TAG:-latest}
    container_name: vsuet_rating_v2-fastapi
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - default
      - web 

  nginx:
    image: nginx:alpine
    container_name: vsuet_rating_v2-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./front:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - app
    networks:
      - default
      - web
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: vsuet_rating_v2-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'
    networks:
      - default

networks:
  web:
    external: true
  default:
    driver: bridge

volumes:
  redis-data:
  certbot-etc:
  certbot-webroot:
