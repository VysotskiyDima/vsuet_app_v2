[project]
name = "vsuet-rating-backend"
version = "0.1.0"
description = "Backend для системы рейтинга студентов ВГУИТ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes (неиспользуемые импорты/переменные и пр.)
    "I",       # isort — порядок импортов
    "B",       # bugbear — типовые ловушки
    "UP",      # pyupgrade — современный синтаксис
    "SIM",     # simplify — упрощение конструкций
    "RUF",     # правила самого ruff
]
ignore = [
    "B008",             # вызовы в дефолтах аргументов — паттерн FastAPI Depends(...)
    "RUF001", "RUF002", "RUF003",  # «неоднозначная» кириллица в строках/комментариях
    "RUF012",           # model_config у pydantic не требует ClassVar
    # str+Enum намеренный: record_to_key опирается на .value, а переход на StrEnum
    # меняет поведение f"{member}" (см. issue про схему ключей Redis).
    "UP042",
]
